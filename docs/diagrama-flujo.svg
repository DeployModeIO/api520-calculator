<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="flj-title flj-desc">
  <title id="flj-title">Cómo funciona la calculadora</title>
  <desc id="flj-desc">Diagrama de flujo horizontal en cinco etapas que describe el dimensionamiento de una válvula de alivio PSV según API STD 520 Parte I y API 526.</desc>

  <defs>
    <filter id="flj-sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2a4a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- fondo -->
  <rect x="0" y="0" width="1600" height="520" fill="#f5f6f8"/>

  <!-- encabezado -->
  <text x="52" y="60" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="34" font-weight="700" fill="#16385e">Cómo funciona la calculadora</text>
  <text x="52" y="92" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="20" fill="#47586b">Flujo de dimensionamiento PSV · API STD 520 Parte I · API 526</text>

  <!-- ===================== ETAPA 1 : ENTRADA ===================== -->
  <g filter="url(#flj-sombra)">
    <rect x="52" y="130" width="280" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <circle cx="90" cy="170" r="15" fill="#ea580c"/>
  <text x="90" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="116" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="20" font-weight="700" fill="#16385e">ENTRADA</text>
  <g transform="translate(174,210) scale(1.5)" stroke="#16385e" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
  </g>
  <text x="72" y="272" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Modo: Gas · Vapor · Líquido</text>
  <text x="72" y="300" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Fluido y presión de ajuste</text>
  <text x="72" y="328" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Sobrepresión y caudal W</text>

  <!-- flecha 1->2 -->
  <line x1="333" y1="255" x2="349" y2="255" stroke="#16385e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="356,255 346,249 346,261" fill="#16385e"/>

  <!-- ===================== ETAPA 2 : PROPIEDADES ===================== -->
  <g filter="url(#flj-sombra)">
    <rect x="356" y="130" width="280" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <circle cx="394" cy="170" r="15" fill="#ea580c"/>
  <text x="394" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="420" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="20" font-weight="700" fill="#16385e">PROPIEDADES</text>
  <g transform="translate(478,210) scale(1.5)" stroke="#16385e" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.2C9 7 6 10.4 6 13.5a6 6 0 0 0 12 0C18 10.4 15 7 12 3.2z"/>
  </g>
  <text x="376" y="272" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">M, k, Z para gas y vapor</text>
  <text x="376" y="300" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">G, μ para líquido</text>
  <text x="376" y="328" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Temperatura y estado</text>

  <!-- flecha 2->3 -->
  <line x1="637" y1="255" x2="653" y2="255" stroke="#16385e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="660,255 650,249 650,261" fill="#16385e"/>

  <!-- ===================== ETAPA 3 : VÁLVULA ===================== -->
  <g filter="url(#flj-sombra)">
    <rect x="660" y="130" width="280" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <circle cx="698" cy="170" r="15" fill="#ea580c"/>
  <text x="698" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="724" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="20" font-weight="700" fill="#16385e">VÁLVULA</text>
  <g transform="translate(782,210) scale(1.5)" stroke="#16385e" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v4M5 7h14M7 7l-3 8h16l-3-8M9 15v3m6-3v3M7 21h10"/>
  </g>
  <text x="680" y="272" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Convencional · Fuelle</text>
  <text x="680" y="300" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">balanceada · Pilotada</text>
  <text x="680" y="328" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Factores Kb y Kw</text>

  <!-- flecha 3->4 -->
  <line x1="941" y1="255" x2="957" y2="255" stroke="#16385e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="964,255 954,249 954,261" fill="#16385e"/>

  <!-- ===================== ETAPA 4 : CÁLCULO API 520 ===================== -->
  <g filter="url(#flj-sombra)">
    <rect x="964" y="130" width="280" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <circle cx="1002" cy="170" r="15" fill="#ea580c"/>
  <text x="1002" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="1028" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="20" font-weight="700" fill="#16385e">CÁLCULO API 520</text>
  <g transform="translate(1086,210) scale(1.5)" stroke="#16385e" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="3" width="14" height="18" rx="2"/>
    <path d="M8.5 7h7"/>
    <path d="M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 15h.01M12 15h.01M15.5 15h.01"/>
  </g>
  <text x="984" y="272" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Crítico o subcrítico</text>
  <text x="984" y="300" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">C / F2, Ksh y Kv</text>
  <text x="984" y="328" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Orificio API 526 D–T</text>

  <!-- flecha 4->5 -->
  <line x1="1245" y1="255" x2="1261" y2="255" stroke="#16385e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1268,255 1258,249 1258,261" fill="#16385e"/>

  <!-- ===================== ETAPA 5 : SALIDA ===================== -->
  <g filter="url(#flj-sombra)">
    <rect x="1268" y="130" width="280" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  </g>
  <circle cx="1306" cy="170" r="15" fill="#ea580c"/>
  <text x="1306" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1332" y="176" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="20" font-weight="700" fill="#16385e">SALIDA</text>
  <g transform="translate(1390,210) scale(1.5)" stroke="#16385e" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <path d="M14 2v6h6"/>
    <path d="M9 15l2 2 4-4"/>
  </g>
  <text x="1288" y="272" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Área requerida y uso</text>
  <text x="1288" y="300" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Orificio y margen</text>
  <text x="1288" y="328" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="18" fill="#47586b">Hoja ISA S20 · PDF</text>

  <!-- banda inferior -->
  <rect x="150" y="420" width="1300" height="60" rx="14" fill="#16385e"/>
  <text x="800" y="456" font-family="system-ui, 'Segoe UI', Inter, Roboto, sans-serif" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">100 % offline · PWA instalable · ES/EN · Tema claro/Solarized · 30 tests · Sin dependencias</text>
</svg>
